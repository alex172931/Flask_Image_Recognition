name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        # Locked versions with hashes, and wheels only (no setup.py scripts)
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock

      - name: Run Pylint
        run: pylint $(git ls-files "*.py")

      - name: Run pytest
        run: pytest -v
