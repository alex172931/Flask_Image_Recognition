name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history, so SonarQube Cloud can use git blame and find new code
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        # Locked versions with hashes, and wheels only (no setup.py scripts)
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock

      - name: Run tests with coverage
        run: >
          pytest -v
          --cov=app --cov=model
          --cov-report=xml:coverage.xml
          --cov-report=term
          --junitxml=test-results.xml

      - name: SonarQube Cloud scan
        # Third-party action pinned to the full commit SHA of tag v6.0.0
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
