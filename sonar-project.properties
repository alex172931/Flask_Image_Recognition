sonar.projectKey=alex172931_Flask_Image_Recognition
sonar.organization=alex172931
sonar.projectName=Flask_Image_Recognition

# SonarQube Cloud now analyses the whole repository and finds the test
# files by itself, so sonar.sources and sonar.tests are not used any more
# (the scanner said they "have no effect"). We only exclude what is not code.
sonar.exclusions=**/__pycache__/**,test_images/**,digit_model.h5

sonar.python.version=3.10
# Reports created by pytest in the GitHub Actions workflow
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

sonar.sourceEncoding=UTF-8
